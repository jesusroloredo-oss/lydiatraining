<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Half Marathon Plan</title>
    <style>
        /* Variables de color - Modo Claro (Por defecto) */
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent: #3b82f6;
            --accent-light: #eff6ff;
            --success: #10b981;
            --success-light: #d1fae5;
            
            --badge-bg: #f1f5f9;
            --danger-bg: #fef2f2;
            --danger-text: #ef4444;
            --danger-border: #fecaca;
            --modal-overlay: rgba(15, 23, 42, 0.7);
        }

        /* Variables de color - Modo Oscuro */
        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --accent: #60a5fa;
            --accent-light: #1e3a8a;
            --success: #10b981;
            --success-light: #064e3b;
            
            --badge-bg: #334155;
            --danger-bg: #450a0a;
            --danger-text: #f87171;
            --danger-border: #7f1d1d;
            --modal-overlay: rgba(0, 0, 0, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 24px 16px 80px 16px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Botón de Modo Oscuro/Claro */
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 16px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }

        .theme-toggle:active {
            transform: scale(0.9);
        }

        header {
            text-align: center;
            margin-bottom: 32px;
            margin-top: 10px;
        }

        header h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        header p {
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 500;
        }

        .phase-section {
            margin-bottom: 40px;
        }

        .phase-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .phase-title::before {
            content: "";
            display: block;
            width: 8px;
            height: 8px;
            background-color: var(--accent);
            border-radius: 50%;
        }

        .week-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02), 0 2px 4px -1px rgba(0,0,0,0.02);
            border: 1px solid var(--border-color);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .week-header {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .run-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: left;
        }

        .run-btn:last-child {
            margin-bottom: 0;
        }

        .run-btn:active {
            transform: scale(0.97);
        }

        .run-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .run-icon {
            width: 40px;
            height: 40px;
            background: var(--accent-light);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: background-color 0.3s ease;
        }

        .run-label {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
        }
        
        .run-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .status-badge {
            background: var(--badge-bg);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            transition: all 0.3s;
        }

        /* Estados cuando está completado */
        .run-btn.done {
            border-color: var(--success);
            background: var(--success-light);
        }

        .run-btn.done .run-icon {
            background: var(--success);
            color: white;
        }

        .run-btn.done .status-badge {
            background: var(--success);
            color: white;
        }

        .run-btn.done .run-hint {
            color: var(--success);
            opacity: 0.8;
            font-weight: 600;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--modal-overlay);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal {
            background: var(--card-bg);
            width: 100%;
            max-width: 360px;
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            transform: translateY(30px) scale(0.95);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal-overlay.active .modal {
            transform: translateY(0) scale(1);
        }

        .modal-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .modal-date {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .modal-type {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
        }

        .modal-content-box {
            background: var(--bg-color);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 32px 20px;
            text-align: center;
            margin-bottom: 24px;
        }

        .modal-content-text {
            font-size: 24px;
            font-weight: 800;
            color: var(--accent);
            line-height: 1.3;
        }

        .modal-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-mark {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-mark.mark-done {
            background: var(--success);
            color: white;
            box-shadow: 0 4px 14px 0 rgba(16, 185, 129, 0.39);
        }
        
        .btn-mark.mark-undone {
            background: var(--danger-bg);
            color: var(--danger-text);
            border: 2px solid var(--danger-border);
            display: none;
        }

        .btn-close {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 14px;
        }
        
        .btn-close:active {
            background: var(--badge-bg);
        }
    </style>
</head>
<body>

    <button id="themeToggle" class="theme-toggle" aria-label="Cambiar tema">🌙</button>

    <header>
        <h1>Mi Media Maratón</h1>
        <p>Road to Race Day 🏃‍♀️💨</p>
    </header>

    <div id="app-container"></div>

    <!-- Modal para ver el entreno -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-date" id="modalDate">Semana del ...</div>
                <div class="modal-type" id="modalType">Tipo de entreno</div>
            </div>
            
            <div class="modal-content-box">
                <div class="modal-content-text" id="modalContent">
                    <!-- Aquí se inyecta el contenido del entreno -->
                </div>
            </div>

            <div class="modal-actions">
                <button class="btn-mark mark-done" id="btnMarkDone">✅ ¡Completado!</button>
                <button class="btn-mark mark-undone" id="btnMarkUndone">Deshacer (Marcar no hecho)</button>
                <button class="btn-close" id="btnClose">Cerrar</button>
            </div>
        </div>
    </div>

    <script>
        // Lógica del Tema Claro / Oscuro
        const themeToggle = document.getElementById('themeToggle');
        
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('themeApp', theme);
            themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
        }

        // Detectar preferencia del sistema o guardada
        const savedTheme = localStorage.getItem('themeApp');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
            setTheme('dark');
        } else {
            setTheme('light');
        }

        // Evento al pulsar el botón
        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            setTheme(currentTheme === 'dark' ? 'light' : 'dark');
        });


        // Datos del Plan
        const planData = [
            {
                title: "Aug - Oct 2026: Base Phase",
                weeks: [
                    { date: "17 Aug 2026", mid: "5K easy", long: "6K" },
                    { date: "24 Aug 2026", mid: "5K easy", long: "7K" },
                    { date: "31 Aug 2026", mid: "5K with some faster sections", long: "8K" },
                    { date: "7 Sep 2026", mid: "5K easy", long: "6K" },
                    { date: "14 Sep 2026", mid: "6K easy", long: "9K" },
                    { date: "21 Sep 2026", mid: "6K easy", long: "10K" },
                    { date: "28 Sep 2026", mid: "6K with hills", long: "8K" },
                    { date: "5 Oct 2026", mid: "6K easy", long: "11K" },
                    { date: "12 Oct 2026", mid: "6K easy", long: "12K" },
                    { date: "19 Oct 2026", mid: "6K with 3 x 5 min brisk", long: "10K" },
                    { date: "26 Oct 2026", mid: "7K easy", long: "13K" },
                    { date: "2 Nov 2026", mid: "7K easy", long: "14K" }
                ]
            },
            {
                title: "Nov 2026 - Jan 2027: Endurance Phase",
                weeks: [
                    { date: "9 Nov 2026", mid: "7K steady", long: "12K" },
                    { date: "16 Nov 2026", mid: "8K steady", long: "15K" },
                    { date: "23 Nov 2026", mid: "7K easy", long: "13K" },
                    { date: "30 Nov 2026", mid: "8K steady", long: "16K" },
                    { date: "7 Dec 2026", mid: "8K with tempo sections", long: "14K" },
                    { date: "14 Dec 2026", mid: "8K steady", long: "17K" },
                    { date: "21 Dec 2026", mid: "7K easy", long: "15K" },
                    { date: "28 Dec 2026", mid: "8K steady", long: "18K" },
                    { date: "4 Jan 2027", mid: "8K with tempo sections", long: "16K" },
                    { date: "11 Jan 2027", mid: "8K steady", long: "19K" }
                ]
            },
            {
                title: "Feb - Mar 2027: Specific Training",
                weeks: [
                    { date: "18 Jan 2027", mid: "8K steady", long: "16K" },
                    { date: "25 Jan 2027", mid: "8K with 4 x 5 min brisk", long: "20K" },
                    { date: "1 Feb 2027", mid: "8K easy", long: "17K" },
                    { date: "8 Feb 2027", mid: "9K steady", long: "21K" },
                    { date: "15 Feb 2027", mid: "8K easy", long: "18K" },
                    { date: "22 Feb 2027", mid: "9K steady", long: "20K" },
                    { date: "1 Mar 2027", mid: "8K easy", long: "16K" }
                ]
            },
            {
                title: "Taper Phase",
                weeks: [
                    { date: "8 Mar 2027", mid: "6K easy", long: "14K" },
                    { date: "15 Mar 2027", mid: "6K easy", long: "12K" },
                    { date: "22 Mar 2027", mid: "5K easy", long: "8K" },
                    { date: "29 Mar 2027", mid: "5K very easy", long: "Half Marathon (4 Apr 2027) 🏁" }
                ]
            }
        ];

        const container = document.getElementById('app-container');
        const modalOverlay = document.getElementById('modalOverlay');
        const btnClose = document.getElementById('btnClose');
        const btnMarkDone = document.getElementById('btnMarkDone');
        const btnMarkUndone = document.getElementById('btnMarkUndone');
        
        let currentRunId = null;

        function getProgress() {
            const saved = localStorage.getItem('halfMarathonProgressApp');
            return saved ? JSON.parse(saved) : {};
        }

        function saveProgress(progressObj) {
            localStorage.setItem('halfMarathonProgressApp', JSON.stringify(progressObj));
        }

        function renderApp() {
            const progress = getProgress();
            let html = '';

            planData.forEach((phase, pIndex) => {
                html += `<div class="phase-section">
                            <h2 class="phase-title">${phase.title}</h2>`;
                
                phase.weeks.forEach((week, wIndex) => {
                    const midId = `run-${pIndex}-${wIndex}-mid`;
                    const longId = `run-${pIndex}-${wIndex}-long`;
                    
                    const isMidDone = progress[midId] ? 'done' : '';
                    const isLongDone = progress[longId] ? 'done' : '';
                    
                    const midStatusText = progress[midId] ? 'DONE' : 'TO DO';
                    const longStatusText = progress[longId] ? 'DONE' : 'TO DO';
                    
                    const midHintText = progress[midId] ? '¡Entreno completado!' : 'Toca para descubrir el entreno';
                    const longHintText = progress[longId] ? '¡Entreno completado!' : 'Toca para descubrir el entreno';

                    html += `
                    <div class="week-card">
                        <div class="week-header">
                            <span>📅 Semana del ${week.date}</span>
                        </div>
                        
                        <button class="run-btn ${isMidDone}" onclick="openModal('${midId}', '${week.date}', 'Midweek Run', '${week.mid}')">
                            <div class="run-info">
                                <div class="run-icon">${progress[midId] ? '🏆' : '👟'}</div>
                                <div>
                                    <div class="run-label">Midweek Run</div>
                                    <div class="run-hint">${midHintText}</div>
                                </div>
                            </div>
                            <span class="status-badge">${midStatusText}</span>
                        </button>

                        <button class="run-btn ${isLongDone}" onclick="openModal('${longId}', '${week.date}', 'Weekend Long Run', '${week.long}')">
                            <div class="run-info">
                                <div class="run-icon">${progress[longId] ? '🏅' : '🔥'}</div>
                                <div>
                                    <div class="run-label">Weekend Run</div>
                                    <div class="run-hint">${longHintText}</div>
                                </div>
                            </div>
                            <span class="status-badge">${longStatusText}</span>
                        </button>
                    </div>`;
                });
                
                html += `</div>`;
            });

            container.innerHTML = html;
        }

        window.openModal = function(id, date, type, content) {
            currentRunId = id;
            document.getElementById('modalDate').textContent = "Semana: " + date;
            document.getElementById('modalType').textContent = type;
            document.getElementById('modalContent').textContent = content;
            
            const progress = getProgress();
            if(progress[currentRunId]) {
                btnMarkDone.style.display = 'none';
                btnMarkUndone.style.display = 'block';
            } else {
                btnMarkDone.style.display = 'block';
                btnMarkUndone.style.display = 'none';
            }

            modalOverlay.classList.add('active');
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            setTimeout(() => { currentRunId = null; }, 300);
        }

        function toggleRunStatus(isDone) {
            if (!currentRunId) return;
            
            const progress = getProgress();
            if (isDone) {
                progress[currentRunId] = true;
            } else {
                delete progress[currentRunId];
            }
            
            saveProgress(progress);
            renderApp();
            closeModal();
        }

        btnClose.addEventListener('click', closeModal);
        btnMarkDone.addEventListener('click', () => toggleRunStatus(true));
        btnMarkUndone.addEventListener('click', () => toggleRunStatus(false));

        modalOverlay.addEventListener('click', (e) => {
            if(e.target === modalOverlay) closeModal();
        });

        renderApp();
    </script>
</body>
</html>
