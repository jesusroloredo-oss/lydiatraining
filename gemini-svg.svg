<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <!-- Degradado de fondo moderno -->
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6" />
            <stop offset="100%" stop-color="#1e3a8a" />
        </linearGradient>
    </defs>
    
    <!-- Fondo con bordes redondeados (estilo app) -->
    <rect width="512" height="512" rx="115" fill="url(#bg)" />
    
    <!-- Cinta de línea de meta (Finish Line) -->
    <rect x="0" y="320" width="512" height="40" fill="#ffffff" />
    <rect x="40" y="320" width="40" height="40" fill="#1e293b" />
    <rect x="120" y="320" width="40" height="40" fill="#1e293b" />
    <rect x="200" y="320" width="40" height="40" fill="#1e293b" />
    <rect x="280" y="320" width="40" height="40" fill="#1e293b" />
    <rect x="360" y="320" width="40" height="40" fill="#1e293b" />
    <rect x="440" y="320" width="40" height="40" fill="#1e293b" />

    <rect x="0" y="360" width="512" height="40" fill="#ffffff" />
    <rect x="0" y="360" width="40" height="40" fill="#1e293b" />
    <rect x="80" y="360" width="40" height="40" fill="#1e293b" />
    <rect x="160" y="360" width="40" height="40" fill="#1e293b" />
    <rect x="240" y="360" width="40" height="40" fill="#1e293b" />
    <rect x="320" y="360" width="40" height="40" fill="#1e293b" />
    <rect x="400" y="360" width="40" height="40" fill="#1e293b" />
    <rect x="480" y="360" width="40" height="40" fill="#1e293b" />
    
    <!-- Texto Principal de la distancia -->
    <text x="256" y="220" font-family="-apple-system, sans-serif" font-weight="900" font-size="140" fill="#ffffff" text-anchor="middle" letter-spacing="-2">21.1K</text>
    
    <!-- Subtítulo motivacional -->
    <text x="256" y="280" font-family="-apple-system, sans-serif" font-weight="700" font-size="36" fill="#93c5fd" text-anchor="middle" letter-spacing="4">FINISHER</text>
</svg>
